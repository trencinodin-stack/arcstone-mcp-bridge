supported_rails:
  - id: "BITCOIN_PSBT_BIP174"
    name: "Bitcoin Partially Signed Bitcoin Transaction (BIP-174)"
    canonical_fields:
      - "network_magic"
      - "inputs[].outpoint"
      - "outputs[].script_pubkey"
      - "outputs[].value_sats"
    volatile_fields_stripped:
      - "fee_rate_sat_vb"
      - "n_sequence"
      - "n_locktime"
      - "rpc_request_id"
  - id: "EVM_EIP712_SETTLEMENT"
    name: "EVM Typed Payment Intent (EIP-712 / EIP-3009)"
    canonical_fields:
      - "chain_id"
      - "verifying_contract"
      - "recipient"
      - "atomic_amount"
      - "logical_intent_id"
    volatile_fields_stripped:
      - "max_fee_per_gas"
      - "max_priority_fee_per_gas"
      - "rpc_timestamp"
      - "trace_id"
  - id: "HTTP_X402_AGENTIC"
