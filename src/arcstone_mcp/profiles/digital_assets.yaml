      - "asset_id"
      - "amount"
      - "resource_uri_sha256"
    volatile_fields_stripped:
      - "http_date"
      - "x_request_id"
      - "retry_attempt"

invariants:
  I1_NON_AUTHORIZATION:
    formula: "D(a) = DENY => Delta_external(a) = 0"
    enforcement: "Denied or unverified custody proposals produce zero UTXO lock or broadcast state mutation."
  I2_SINGLE_COMMIT:
    formula: "Permit(96B) = token_id(32B) || h_admitted_sha256(32B) || epoch_lease(8B) || valid_not_after_ns(8B) || mac(16B)"
    enforcement: "RBF fee bumps and RPC timeout retries resolve to identical h_admitted_sha256 and transition to LOCKED_MANUAL (POSIX 32)."
  I3_ZERO_AMBIENT_AUTHORITY:
    formula: "UntrustedProducer != ProtectedResource"
    enforcement: "Bridge holds zero private keys, seed phrases, or HSM signing credentials; strictly read-only simulation."

regulatory_framework:
  primary_guidance:
    - "FATF Travel Rule / Sanctions Screening (TR-GATE-01)"
    - "Qualified Custodian HSM / MPC Key Segregation (CUSTODY-TCB-02)"
    - "SOC 2 Type II / Crypto Custody Settlement Idempotency (IDEMP-CAS-03)"
  control_classification: "Preventive Custody Admission Control & Pre-Broadcast Idempotency Gate"
  excluded_from_mrm_model_def: true

regulatory_matrix:
  - framework: "FATF Travel Rule / Sanctions Screening"
    control_id: "TR-GATE-01"
    kernel_guarantee: "Fail-closed admission gate (I1) prevents permit minting without valid beneficiary attestation digest."
    customer_tcb: "VASP counterparty identity verification and sanctions screening provider."
  - framework: "Qualified Custodian HSM / MPC Key Segregation"
    control_id: "CUSTODY-TCB-02"
    kernel_guarantee: "Zero ambient agent signing authority (I3); 96-byte ExecutionPermit MAC verification required."
    customer_tcb: "FIPS 140-3 Level 3+ HSM or threshold MPC enclave validating permit signature before broadcast."
  - framework: "SOC 2 Type II / Settlement Idempotency"
    control_id: "IDEMP-CAS-03"
    kernel_guarantee: "7-state CAS reconciliation prevents double-spend under RPC timeout or RBF retry storms (I2)."
    customer_tcb: "Durable linearizable CAS store (PostgreSQL / Raft) persisting permit epoch leases."

commercial_boundary:
  open_evaluation: "MIT/Apache-2.0 reference predicate, Coq 8.18.0 proofs, PSBT/EIP-712/x402 canonicalization vectors"
  enterprise_license_scope: "Production runtime profiles, FIPS 140-3 HSM/MPC enclave adapters, durable linearizable CAS persistence, VASP Travel Rule policy oracles"

