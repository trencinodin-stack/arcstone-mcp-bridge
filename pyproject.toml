[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arcstone-mcp-bridge"
version = "0.1.0"
description = "Universal read-only conformance and sandbox-simulation MCP bridge for the Arcstone Computational Spine (ARC-SPEC-2026-MCP-01)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
arcstone-mcp-bridge = "arcstone_mcp.server:main"
